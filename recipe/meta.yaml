{% set name = "compress_json" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/compress_json-{{ version }}.tar.gz
  sha256: 81f6e3a340e18fe45c2f8dfe1483d253d0444c57ab335038439004cc871af605

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - pip
  run:
    - python >=3.8

test:
  imports:
    - compress_json
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/LucaCappelletti94/compress_json
  summary: The missing Python utility to read and write large compressed JSONs.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - isuruf
    - dillonroach
